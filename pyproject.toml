[project]
name = "conlang-generator"
version = "0.1.0"
description = "Generate constructed languages and translate to/from English."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "typer>=0.13",
    "python-dotenv>=1.0",
]

[project.scripts]
conlang = "conlang_generator.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default OS temp dir is locked down in some sandboxed environments this
# project is developed in; keep pytest's tmp_path fixture inside the repo.
# -n auto --dist loadfile: parallelize across CPU cores, one worker per test
# FILE (not per individual test) -- this project's tests/_shared_language.py
# cache is a plain process-wide dict, so splitting a single file's tests
# across workers would fragment that cache and erase the parallelism gain
# (measured: default `-n auto` load-balancing gave ~0% speedup on a
# cache-heavy pair of files; `--dist loadfile` gave ~1.6x on the full suite).
# No `-m` here on purpose: pytest-testmon auto-disables its own selective
# test skipping whenever a `-m` marker expression is active anywhere in the
# invocation, addopts included -- "skip slow tests by default" is handled
# instead by tests/conftest.py's pytest_collection_modifyitems, which never
# puts `-m` on the command line, so testmon's selection stays active for the
# default `--testmon` invocation. `pytest -m slow`/`pytest -m ''` still work
# as documented below (that conftest hook steps aside whenever the user
# passes `-m` themselves).
addopts = "--basetemp=.pytest_tmp -n auto --dist loadfile"
markers = [
    "slow: takes more than a few seconds (hundreds of generated languages, real audio synthesis); skipped by default -- run with `pytest -m slow` (only these) or `pytest -m ''` (everything)",
]
