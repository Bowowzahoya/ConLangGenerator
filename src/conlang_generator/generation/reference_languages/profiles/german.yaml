name: German
aliases: [deutsch]
consonants: [p, b, t, d, k, g, f, v, s, z, "ʃ", "ç", x, h, m, n, "ŋ", l, "ʁ", j]
vowels: [i, "ɪ", e, "ɛ", a, "ɔ", o, u, "ʊ", y, "ø", "œ", "ə", "aː", "eː", "iː", "oː", "uː", ai, au, "œy"]
coda_profile: unrestricted
max_onset: 2
tonal: false
coda_devoicing: true
orthography_category: germanic-doubling-style
capitalized_pos: [noun]  # real German capitalizes every common noun, not just proper nouns
restricted_onset_consonants: ["ŋ"]  # /ŋ/ is coda/medial-only in real German, never opens a syllable
restricted_coda_consonants: [j]  # German diphthongs (ai/au/œy) are vowel symbols, not consonant codas; German doesn't model /w/ as a consonant at all
attested_onset_clusters:
  # Real, common German onset clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive (only used when
  # source_language_strictness > 0).
  - [p, f]                   # "Pferd"
  - [k, n]                   # "Knie"
  - [k, l]                   # "Klein"
  - [k, "ʁ"]                  # "Kraft"
  - [g, l]                   # "Glas"
  - [g, "ʁ"]                  # "Gras"
  - [b, l]                   # "Blau"
  - [b, "ʁ"]                  # "Brot"
  - [d, "ʁ"]                  # "Drei"
  - [t, "ʁ"]                  # "Traum"
  - [f, l]                   # "Flug"
  - [f, "ʁ"]                  # "Frau"
  - ["ʃ", p]                  # "Spiel" (realized [ʃp])
  - ["ʃ", t]                  # "Stein" (realized [ʃt])
  - ["ʃ", l]                  # "Schlaf"
  - ["ʃ", m]                  # "Schmerz"
  - ["ʃ", n]                  # "Schnee"
  - ["ʃ", "ʁ"]                 # "Schrift"
  - ["ʃ", v]                  # "Schwester"
attested_coda_clusters:
  # Real, common German coda clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive.
  - [n, t]                   # "und"
  - [n, d]                   # "Land"
  - ["ŋ", k]                  # "Bank"
  - [l, t]                   # "Welt"
  - [l, d]                   # "Geld"
  - [l, k]                   # "Volk"
  - [l, m]                   # "Film"
  - ["ʁ", t]                  # "hart"
  - ["ʁ", k]                  # "stark"
  - ["ʁ", n]                  # "Kern"
  - ["ʁ", m]                  # "Arm"
  - [p, f]                   # "Kopf"
  - [x, t]                   # "Nacht"
  - ["ç", t]                  # "nicht"
  - [s, t]                   # "ist"
orthography:
  # Real German spelling conventions, restricted to symbols this profile
  # actually models -- illustrative, not a full account.
  - {ipa: "ʃ", latin: sch}   # "Schule"
  - {ipa: "ç", latin: ch}    # "ich" (ich-laut)
  - {ipa: x, latin: ch}      # "ach" (ach-laut) -- real German spells
                             # both ich-laut and ach-laut identically
  - {ipa: "ʁ", latin: r}     # standard German's real uvular r
  - {ipa: "ŋ", latin: ng}    # "singen"
  - {ipa: y, latin: "ü"}     # "über"
  - {ipa: "ø", latin: "ö"}   # "schön"
  - {ipa: "œ", latin: "ö"}   # "können" -- real German spells both ö
                             # qualities the same way
  - {ipa: "ə", latin: e}     # "bitte"
  - {ipa: "ɪ", latin: i}     # "mit"
  - {ipa: "ʊ", latin: u}     # "und"
  - {ipa: "ɔ", latin: o}     # "voll"
  - {ipa: "ɛ", latin: e}     # "Bett" -- real German also spells this
                             # "ä" in umlauted words, a per-word not
                             # per-symbol exception this project's rule
                             # system can't capture (same category of
                             # gap as Dutch's own au/ou, ei/ij).
  - {ipa: ai, latin: ei}     # "mein" -- the more common of German's two
                             # real spellings for this diphthong ("ai"
                             # the real, rarer counter-example)
  - {ipa: au, latin: au}     # "Haus"
  - {ipa: "œy", latin: eu}   # "neu" -- real German's third diphthong,
                             # approximated by this project's œy symbol
core_vocabulary_average_syllables: 1.43  # hand-counted across this project's own CORE_MEANINGS glosses -- the longest of the four perfected languages, reflecting German's retained endings (Wasser, Mutter, Vater...)
