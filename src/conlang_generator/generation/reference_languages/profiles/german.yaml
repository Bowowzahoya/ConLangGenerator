name: German
aliases: [deutsch]
consonants: [p, b, t, d, k, g, f, v, s, z, "ʃ", "ç", x, h, m, n, "ŋ", l, "ʁ", j]
vowels: [i, "ɪ", e, "ɛ", a, "ɔ", o, u, "ʊ", y, "ø", "œ", "ə", "aː", "eː", "iː", "oː", "uː", ai, au, "œy"]
coda_profile: unrestricted
max_onset: 2
tonal: false
coda_devoicing: true
orthography_category: germanic-doubling-style
capitalized_pos: [noun]  # real German capitalizes every common noun, not just proper nouns
stress_pattern: initial  # real German: usually the root's first syllable (Wasser, Mutter, Vater)
stress_deviation_rate: 0.2  # illustrative -- loanwords and certain separable/inseparable-prefix verbs are the real exceptions
stress_driven_vowel_reduction: true  # real German: unstressed syllables (especially word-final "-e"/"-en"/"-er") reduce to schwa (bitte, Wasser, geben) -- already the reasoning behind /ə/ being curated very_common in nucleus_frequency_tiers below
restricted_onset_consonants: ["ŋ"]  # /ŋ/ is coda/medial-only in real German, never opens a syllable
restricted_coda_consonants: [j]  # German diphthongs (ai/au/œy) are vowel symbols, not consonant codas; German doesn't model /w/ as a consonant at all
attested_onset_clusters:
  # Real, common German onset clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive (only used when
  # source_language_strictness > 0).
  - [p, f]                   # "Pferd"
  - [k, n]                   # "Knie"
  - [k, l]                   # "Klein"
  - [k, "ʁ"]                  # "Kraft"
  - [g, l]                   # "Glas"
  - [g, "ʁ"]                  # "Gras"
  - [b, l]                   # "Blau"
  - [b, "ʁ"]                  # "Brot"
  - [d, "ʁ"]                  # "Drei"
  - [t, "ʁ"]                  # "Traum"
  - [f, l]                   # "Flug"
  - [f, "ʁ"]                  # "Frau"
  - [k, v]                   # "Quelle"/"Qualität" -- real German "qu" = /kv/, always spelled that way (see orthography)
  - ["ʃ", p]                  # "Spiel" (realized [ʃp])
  - ["ʃ", t]                  # "Stein" (realized [ʃt])
  - ["ʃ", l]                  # "Schlaf"
  - ["ʃ", m]                  # "Schmerz"
  - ["ʃ", n]                  # "Schnee"
  - ["ʃ", "ʁ"]                 # "Schrift"
  - ["ʃ", v]                  # "Schwester"
attested_coda_clusters:
  # Real, common German coda clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive.
  - [n, t]                   # "und"
  - [n, d]                   # "Land"
  - ["ŋ", k]                  # "Bank"
  - [l, t]                   # "Welt"
  - [l, d]                   # "Geld"
  - [l, k]                   # "Volk"
  - [l, m]                   # "Film"
  - ["ʁ", t]                  # "hart"
  - ["ʁ", k]                  # "stark"
  - ["ʁ", n]                  # "Kern"
  - ["ʁ", m]                  # "Arm"
  - [p, f]                   # "Kopf"
  - [x, t]                   # "Nacht"
  - ["ç", t]                  # "nicht"
  - [s, t]                   # "ist"
orthography:
  # Real German spelling conventions, restricted to symbols this profile
  # actually models -- illustrative, not a full account.
  - {ipa: "ʃ", latin: sch}   # "Schule"
  - {ipa: "ç", latin: ch}    # "ich" (ich-laut)
  - {ipa: x, latin: ch}      # "ach" (ach-laut) -- real German spells
                             # both ich-laut and ach-laut identically
  - {ipa: "ʁ", latin: r}     # standard German's real uvular r
  - {ipa: "ŋ", latin: ng}    # "singen"
  - {ipa: y, latin: "ü"}     # "über"
  - {ipa: "ø", latin: "ö"}   # "schön"
  - {ipa: "œ", latin: "ö"}   # "können" -- real German spells both ö
                             # qualities the same way
  - {ipa: "ə", latin: e}     # "bitte"
  - {ipa: "ɪ", latin: i}     # "mit"
  - {ipa: "ʊ", latin: u}     # "und"
  - {ipa: "ɔ", latin: o}     # "voll"
  # /ɛ/: real German genuinely splits between plain "e" (Bett, Geld,
  # wenn) and "ä" in umlaut-derived words (Hände, Länder, Männer) -- a
  # real, productive alternation with no phonological rule predicting
  # which from context alone.
  - {ipa: "ɛ", latin: e, weight: 0.7}
  - {ipa: "ɛ", latin: "ä", weight: 0.3}
  # /ai/: "ei" dominates (mein, dein, sein, Wein, Stein, klein, zwei --
  # including several core-vocabulary numbers/pronouns), but "ai" is a
  # real, if much rarer, alternative (Mai, Kaiser, Mais, Saite).
  - {ipa: ai, latin: ei, weight: 0.9}
  - {ipa: ai, latin: ai, weight: 0.1}
  - {ipa: au, latin: au}     # "Haus"
  - {ipa: "œy", latin: eu}   # "neu" -- real German's third diphthong,
                             # approximated by this project's œy symbol
  # /v/: real German overwhelmingly spells this sound "w" (Wasser, Wein,
  # wir -- German "v" the *letter* is usually /f/, a different phoneme,
  # see below), with a genuine minor "v" alternative in loanwords (Vase,
  # Vulkan).
  - {ipa: v, latin: w, weight: 0.85}
  - {ipa: v, latin: v, weight: 0.15}
  - {ipa: v, latin: u, preceding: ["k"]}  # "Quelle"/"Qualität"/"bequem" -- the /kv/ cluster is always spelled "qu", overriding the w/v alternation above
  # /z/: real German never writes this sound with the letter "z" (that
  # letter is reserved for /ts/, not modeled as its own phoneme here) --
  # always "s" (sagen, lesen, Sonne), deterministic, not a real
  # alternation the way /v/ above is.
  - {ipa: z, latin: s}
  # /f/: dominant "f" (Fisch, Frau), with a genuine minor "v" alternative
  # in a handful of common native words (Vater, Vogel, viel, vier, von,
  # vor) -- distinct from loanword /v/ above, which is a different
  # phoneme spelled with the same letter.
  - {ipa: f, latin: f, weight: 0.85}
  - {ipa: f, latin: v, weight: 0.15}
  # /k/: dominant "k" (Katze, kalt, Keller), with a real "ck" alternative
  # after a short vowel (Zucker, Ecke, Drucker) -- approximated as a flat
  # alternative, same caveat as English's own k/c/ck fix (this project's
  # condition system doesn't have the short-vowel-coda compound condition
  # that real rule actually needs). Plain "c" for /k/ is loanword-only in
  # native German (Computer, Café), not modeled as a third alternative.
  - {ipa: k, latin: k, weight: 0.85}
  - {ipa: k, latin: ck, weight: 0.15}
  - {ipa: k, latin: q, following: ["v"]}  # "Quelle"/"Qualität" -- overrides the weighted k/ck alternatives above whenever /v/ follows
core_vocabulary_average_syllables: 1.43  # hand-counted across this project's own CORE_MEANINGS glosses -- the longest of the four perfected languages, reflecting German's retained endings (Wasser, Mutter, Vater...)
onset_frequency_tiers:
  very_common: ["ʃ", "ʁ"]  # the very productive native schl-/schm-/schn-/schw-/schr- cluster family; r- broadly productive too
  common: [b, d, f, g, h, k, l, m, n, p, s, t]
  uncommon: [v, z, j]
  rare: [x, "ç"]  # both overwhelmingly post-vocalic in native German -- word-initial is close to loanword-only
coda_frequency_tiers:
  # /ç/ is very_common here despite being onset-rare -- "ich"/"nicht"
  # plus the very productive -lich adjective family.
  very_common: [n, t, s, "ç"]
  common: ["ʁ", m, l, k, g, d]
  uncommon: [f, b, p, v, "ŋ"]
  rare: ["ʃ", z, h, x]
nucleus_frequency_tiers:
  very_common: ["ə", "ɪ", a]
  common: ["ɛ", ai, u, o, au]
  uncommon: [e, "ɔ", "ʊ", "iː", "aː", i, "eː"]
  rare: [y, "ø", "œ", "œy", "oː", "uː"]
