name: Indonesian
aliases: [malay, bahasa]
consonants: [p, b, t, d, k, g, "tʃ", "dʒ", f, s, z, "ʃ", h, m, n, "ɲ", "ŋ", l, r, j, w]
vowels: [i, e, "ə", a, o, u]
coda_profile: unrestricted
max_onset: 2
tonal: false
orthography_category: digraph-style
orthography:
  # Real modern Indonesian orthography -- like Turkish, these aren't
  # invented transliteration conventions at all: Indonesian's own native
  # Latin alphabet already spells these sounds exactly this way.
  - {ipa: "tʃ", latin: c}
  - {ipa: "dʒ", latin: j}
  - {ipa: "ɲ", latin: ny}
  - {ipa: "ŋ", latin: ng}
  - {ipa: "ʃ", latin: sy}
  - {ipa: "ə", latin: e}     # real Indonesian spells both /e/ and /ə/
                              # with the same letter "e"
