name: Finnish
# "kː" (real: kukka/kuka -- phonemic consonant length) is what Finnish is
# the textbook example for; see orthography_category below.
consonants: [p, t, k, "kː", d, m, n, "ŋ", s, h, l, r, j, v]
vowels: [i, a, u, e, o, y, "ø", "æ"]
coda_profile: unrestricted
max_onset: 1
tonal: false
vowel_harmony: true
orthography_category: gemination-style
orthography:
  # Finnish's own real vowel letters. Not curating "kː" here -- this
  # profile's own gemination-style category already generates a doubling
  # rule for it structurally (`_generate_gemination_rules`), so a
  # reference entry would be redundant with, and could conflict with, the
  # inventory-driven one.
  - {ipa: "ø", latin: "ö"}
  - {ipa: "æ", latin: "ä"}
  - {ipa: "ŋ", latin: ng}
