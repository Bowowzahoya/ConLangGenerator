name: Dutch
aliases: [nederlands]
consonants: [p, b, t, d, k, f, v, s, z, x, "ɣ", h, m, n, "ŋ", l, r, w, j]
vowels: [i, "ɪ", e, "ɛ", a, "ɑ", "ɔ", o, u, y, "ø", "œ", "ə", "ɛi", "œy", au]
coda_profile: unrestricted
max_onset: 2
tonal: false
coda_devoicing: true
orthography_category: germanic-doubling-style
stress_pattern: initial  # real Dutch: usually the root's first syllable, same Germanic default as German
stress_deviation_rate: 0.2  # illustrative -- loanwords and certain prefixed verbs are the real exceptions
restricted_onset_consonants: ["ŋ"]  # /ŋ/ is coda/medial-only in real Dutch, never opens a syllable (same as German/English)
attested_onset_clusters:
  # Real, common Dutch onset clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive (only used when
  # source_language_strictness > 0). s + voiceless stop (sp/st/sk) is
  # already handled generically by sonority.is_legal_onset_cluster's own
  # special case, so it's not duplicated here.
  - [p, l]                   # "plaats"
  - [p, r]                   # "prachtig"
  - [b, l]                   # "blauw"
  - [b, r]                   # "brood"
  - [t, r]                   # "trein"
  - [t, w]                   # "twee"
  - [d, r]                   # "droom"
  - [d, w]                   # "dwars"
  - [k, l]                   # "klein"
  - [k, n]                   # "knie"
  - [k, r]                   # "krant"
  - [k, w]                   # "kwart"
  - [f, l]                   # "fluiten"
  - [f, r]                   # "fris"
  - [v, l]                   # "vlieg"
  - [v, r]                   # "vroeg"
  - ["ɣ", l]                  # "glas" -- Dutch "g" is /ɣ/, not a stop
  - ["ɣ", r]                  # "groot"
  - [z, w]                   # "zwart"
  - [s, l]                   # "slaap"
  - [s, m]                   # "smal"
  - [s, n]                   # "snel"
attested_coda_clusters:
  # Real, common Dutch coda clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive.
  - [r, t]                   # "hard"
  - [r, k]                   # "sterk"
  - [r, m]                   # "arm"
  - [r, n]                   # "kern"
  - [r, d]                   # "paard"
  - [l, p]                   # "help"
  - [l, k]                   # "melk"
  - [l, m]                   # "film"
  - [l, t]                   # "wilt"
  - [n, t]                   # "kant"
  - [n, d]                   # "land"
  - ["ŋ", k]                  # "bank"
  - [s, t]                   # "kust"
  - [s, p]                   # "wesp"
  - [x, t]                   # "nacht"
orthography:
  # Real Dutch spelling conventions, restricted to symbols this profile
  # actually models -- illustrative, not a full account. Long vowels that
  # alternate between a doubled letter (closed syllable) and a single
  # letter (open syllable) -- "vuur" /vy:r/ vs. "vuren" /'vy:rən/:
  # doubling marks length only where the syllable needs it, an open
  # syllable is already unambiguously long by Dutch spelling convention.
  - {ipa: a, latin: aa, syllable: [syllable_closed]}   # "kaas"
  - {ipa: a, latin: a, syllable: [syllable_open]}       # "kazen"
  - {ipa: e, latin: ee, syllable: [syllable_closed]}    # "veer"
  - {ipa: e, latin: e, syllable: [syllable_open]}       # "veren"
  - {ipa: o, latin: oo, syllable: [syllable_closed]}    # "boot"
  - {ipa: o, latin: o, syllable: [syllable_open]}       # "boten"
  - {ipa: y, latin: uu, syllable: [syllable_closed]}    # "vuur"
  - {ipa: y, latin: u, syllable: [syllable_open]}       # "vuren"
  # Digraph-spelled long vowels never double, in either syllable type --
  # always the same grapheme.
  - {ipa: u, latin: oe}    # "boek"/"boeken"
  - {ipa: i, latin: ie}    # "lied"/"lieden"
  - {ipa: "ø", latin: eu}  # "deur"/"deuren"
  # Short vowels can't end an open syllable in Dutch phonotactics, so
  # there's no alternation to encode for these.
  - {ipa: "œ", latin: u}   # "hut"
  - {ipa: "ɪ", latin: i}   # "kind"
  - {ipa: "ɑ", latin: a}   # "kat"
  - {ipa: "ɔ", latin: o}   # "zon"
  - {ipa: "ɛ", latin: e}   # "bed"
  - {ipa: "ə", latin: e}   # "de"
  - {ipa: x, latin: ch}    # "nacht" -- voiceless velar fricative
  - {ipa: "ɣ", latin: g}   # "goed" -- voiced velar fricative, the actual
                           # sound Dutch "g" represents (not a stop)
  - {ipa: "ŋ", latin: ng}  # "zingen"
  - {ipa: j, latin: j}     # "ja"
  # Diphthongs. Real Dutch spells /ɛi/ as "ij" *or* "ei", and /au/ as
  # "ou" *or* "au", depending on the specific word's etymology, with no
  # phonological rule predicting which -- genuine weighted alternatives
  # (hij/wij/mijn/prijs -- extremely common "ij" words -- vs. klein/
  # trein/geheim/reis for "ei"; koud/oud/goud/hout/fout for "ou" vs.
  # blauw/gauw/nauw/pauze for "au"). /œy/ has no such ambiguity -- always
  # "ui".
  - {ipa: "ɛi", latin: ij, weight: 0.65}
  - {ipa: "ɛi", latin: ei, weight: 0.35}
  - {ipa: "œy", latin: ui}  # "huis"
  - {ipa: au, latin: ou, weight: 0.75}
  - {ipa: au, latin: au, weight: 0.25}
core_vocabulary_average_syllables: 1.27  # hand-counted across this project's own CORE_MEANINGS glosses -- shorter than German due to Dutch's own schwa-apocope (vuur/zon vs. Feuer/Sonne), but not as short as English
onset_frequency_tiers:
  very_common: ["ɣ", s]  # g-spelled onsets are broadly productive: gaan, goed, groot, geven
  common: [p, b, t, d, k, f, v, h, m, n, l, r, w, j]
  uncommon: [z]
  rare: [x]  # word-initial ch-/x- is close to loanword-only: chaos, chemie
coda_frequency_tiers:
  # /x/ flips from onset-rare to coda-very_common -- the "-cht"/"-acht"
  # family (nacht, recht, acht, licht) is one of the most characteristic,
  # productive patterns in Dutch.
  very_common: [n, t, x]
  common: [s, l, r, k, p, m]
  uncommon: [f, b, d, "ŋ"]
  rare: [v, z, "ɣ", h, j, w]
nucleus_frequency_tiers:
  very_common: ["ə", a]
  common: ["ɪ", "ɛ", o, u, "ɑ"]
  uncommon: [i, "ɔ", y, "ø", au, e]
  rare: ["œ", "ɛi", "œy"]
