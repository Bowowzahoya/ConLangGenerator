name: Georgian
consonants: [p, b, t, d, k, g, "tʃ", "dʒ", "pʼ", "tʼ", "kʼ", q, m, n, s, "ʃ", x, z, "ʒ", v, l, r, j, w]
vowels: [i, a, u, e, o]
coda_profile: unrestricted
max_onset: 2
max_coda: 1  # real Georgian's famous multi-consonant sequences (up to 5-6 members) are word/stem-*initial* onsets -- underived words have no coda clusters at all
tonal: false
orthography_category: digraph-style
orthography:
  # The real Georgian National System's apostrophe-for-ejectives
  # convention -- the single most useful curated addition in this whole
  # pool, since this profile's own native inventory is the one place
  # `ejective_drift`'s output (pʼ/tʼ/kʼ) has genuine real-world precedent
  # anywhere in this project's reference set.
  - {ipa: "pʼ", latin: "p'"}
  - {ipa: "tʼ", latin: "t'"}
  - {ipa: "kʼ", latin: "k'"}
  - {ipa: "tʃ", latin: ch}
  - {ipa: "dʒ", latin: j}
