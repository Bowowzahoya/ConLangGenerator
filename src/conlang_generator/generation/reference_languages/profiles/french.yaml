name: French
aliases: [francais, français]
consonants: [p, b, t, d, k, g, f, v, s, z, "ʃ", "ʒ", m, n, "ɲ", l, "ʁ", j, w]
vowels: [i, e, "ɛ", a, "ɑ", "ɔ", o, u, y, "ø", "œ", "ə"]
coda_profile: unrestricted
max_onset: 2
tonal: false
orthography_category: diacritic-style
mute_suffix_by_pos: [{pos: verb, suffix: r}]  # real French infinitive "-er"'s silent r ("parler" /paʁle/)
restricted_coda_consonants: [w]  # /w/ is essentially onset-only in real French ("oui"); /j/ is genuinely attested in codas (soleil, travail) so it's deliberately NOT restricted here
attested_onset_clusters:
  # Real, common French onset clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive (only used when
  # source_language_strictness > 0). s + voiceless stop (sport, stylo,
  # ski) is already handled generically by sonority.is_legal_onset_cluster's
  # own special case, so it's not duplicated here.
  - [p, l]                   # "pluie"
  - [p, "ʁ"]                  # "prendre"
  - [b, l]                   # "bleu"
  - [b, "ʁ"]                  # "bras"
  - [t, "ʁ"]                  # "train"
  - [d, "ʁ"]                  # "droit"
  - [k, l]                   # "classe"
  - [k, "ʁ"]                  # "crayon"
  - [g, l]                   # "glace"
  - [g, "ʁ"]                  # "grand"
  - [f, l]                   # "fleur"
  - [f, "ʁ"]                  # "froid"
  - [v, "ʁ"]                  # "vrai"
orthography:
  # Real French spelling conventions, restricted to symbols this profile
  # actually models -- illustrative, not a full account (real French
  # spelling has plenty of lexical/etymological exceptions to the general
  # pattern below; nasal vowels aren't modeled at all, since this
  # project's phoneme pool has no nasal-vowel symbols).
  #
  # /ʒ/: "g" is naturally soft before a front vowel ("manger" /mɑ̃.ʒe/,
  # e is front); before a back vowel a plain "g" would harden to /g/, so
  # French inserts a silent "e" to keep it soft ("mangeons" /mɑ̃.ʒɔ̃/, not
  # *mangons -- ɔ is back). Elsewhere, "j" is the unconditioned spelling.
  - {ipa: "ʒ", latin: g, following: [front_vowel]}
  - {ipa: "ʒ", latin: ge, following: [back_vowel]}
  - {ipa: "ʒ", latin: j}
  # /s/: mirrors the /ʒ/ pattern -- "c" is soft before a front vowel
  # ("cent" /sɑ̃/); before a back vowel plain "c" would harden to /k/, so
  # French uses a cedilla to force it soft ("garçon" /ɡaʁsɔ̃/, ɔ is back).
  - {ipa: s, latin: c, following: [front_vowel]}
  - {ipa: s, latin: "ç", following: [back_vowel]}
  - {ipa: s, latin: s}
  # This profile's own remaining non-ASCII vowels/consonants.
  - {ipa: "ɛ", latin: "è"}   # real French's own open-e mark -- "è" (grave),
                              # never the generic diacritic-style table's
                              # "ë", which in real French marks a
                              # hiatus/diaeresis ("Noël"), not vowel quality
  - {ipa: "ɑ", latin: "â"}
  - {ipa: "ɔ", latin: o}
  - {ipa: "ø", latin: eu}
  - {ipa: "œ", latin: eu}
  - {ipa: "ə", latin: e}
  - {ipa: "ɲ", latin: gn}
  - {ipa: "ʁ", latin: r}
core_vocabulary_average_syllables: 1.35  # hand-counted across this project's own CORE_MEANINGS glosses -- between English and German, reflecting a mix of monosyllabic (eau, feu) and longer Latinate (animal, poisson) core words
onset_frequency_tiers:
  very_common: ["ʁ", s]  # French's only rhotic, in nearly every infinitive verb; s- broadly productive
  common: [p, t, k, b, d, g, f, v, m, n, l, j, w, "ʃ", "ʒ"]  # "ʒ" (je-family) is a broad, productive class here, unlike English /ð/'s closed set
  uncommon: [z]
  rare: ["ɲ"]  # gn- word-initial is rare -- almost all /ɲ/ is medial (montagne, ligne, agneau)
coda_frequency_tiers:
  very_common: ["ʁ", l]  # -er/-ir agent-noun/infinitive productivity; le/la/les-family productivity carries l into codas too
  common: [s, n, t, d, k, p, b, g, f, v, m, "ʃ", "ʒ", j]
  uncommon: [z]
  rare: ["ɲ"]
nucleus_frequency_tiers:
  very_common: ["ə", a]
  common: [e, "ɛ", i, u, o]
  uncommon: ["ɔ", "ɑ"]
  rare: [y, "ø", "œ"]
