name: French
aliases: [francais, français]
consonants: [p, b, t, d, k, g, f, v, s, z, "ʃ", "ʒ", m, n, "ɲ", l, "ʁ", j, w]
vowels: [i, e, "ɛ", a, "ɑ", "ɔ", o, u, y, "ø", "œ", "ə"]
coda_profile: unrestricted
max_onset: 2
tonal: false
orthography_category: diacritic-style
syllable_boundary_marker: diaeresis  # real French tréma (Noël, naïve) -- specific to French, not shared by the other diacritic-style profiles (Icelandic, Persian, Portuguese, Quechua, Russian, Spanish, Tibetan, Turkish)
onset_nucleus_spellings:
  # Real French /w/+/a/ (moi, roi, voix) is spelled "oi" as a genuine
  # *joint* unit -- 2 letters for 2 phonemes, consuming both, not "oi"
  # (for /w/ alone) plus a separate "a" appended after (which would
  # wrongly produce "moia").
  - {first: w, second: a, latin: oi}
mute_suffix_by_pos: [{pos: verb, suffix: r}]  # real French infinitive "-er"'s silent r ("parler" /paʁle/)
restricted_coda_consonants: [w]  # /w/ is essentially onset-only in real French ("oui"); /j/ is genuinely attested in codas (soleil, travail) so it's deliberately NOT restricted here
restricted_onset_nucleus_pairs:
  # Real French /w/ only ever precedes a (moi, roi), i (oui), or ɛ
  # (ouest) -- /w/ before any other vowel essentially doesn't occur
  # natively (French "wagon" is actually /v/, not /w/). Blacklisting the
  # rest keeps a strict French language from generating implausible
  # sequences like /w/+/o/, which used to spell as nonsense ("oueau").
  - [w, o]
  - [w, u]
  - [w, y]
  - [w, "ø"]
  - [w, "œ"]
  - [w, "ɔ"]
  - [w, e]
  - [w, "ə"]
  - [w, "ɑ"]
attested_onset_clusters:
  # Real, common French onset clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive (only used when
  # source_language_strictness > 0). s + voiceless stop (sport, stylo,
  # ski) is already handled generically by sonority.is_legal_onset_cluster's
  # own special case, so it's not duplicated here.
  - [p, l]                   # "pluie"
  - [p, "ʁ"]                  # "prendre"
  - [b, l]                   # "bleu"
  - [b, "ʁ"]                  # "bras"
  - [t, "ʁ"]                  # "train"
  - [d, "ʁ"]                  # "droit"
  - [k, l]                   # "classe"
  - [k, "ʁ"]                  # "crayon"
  - [g, l]                   # "glace"
  - [g, "ʁ"]                  # "grand"
  - [f, l]                   # "fleur"
  - [f, "ʁ"]                  # "froid"
  - [v, "ʁ"]                  # "vrai"
orthography:
  # Real French spelling conventions, restricted to symbols this profile
  # actually models -- illustrative, not a full account (real French
  # spelling has plenty of lexical/etymological exceptions to the general
  # patterns below; nasal vowels aren't modeled at all, since this
  # project's phoneme pool has no nasal-vowel symbols). Several sounds
  # below have genuinely more than one real spelling with no phonological
  # rule to predict which -- `weight` picks a reproducible-per-word
  # alternative among ties, it doesn't mean "rare"; omitted entirely
  # where French really does have just one spelling.
  #
  # /ʒ/: "g" is naturally soft before a front vowel ("manger" /mɑ̃.ʒe/,
  # e is front); before a back vowel a plain "g" would harden to /g/, so
  # French inserts a silent "e" to keep it soft ("mangeons" /mɑ̃.ʒɔ̃/, not
  # *mangons -- ɔ is back). Elsewhere, "j" is the unconditioned spelling.
  - {ipa: "ʒ", latin: g, following: [front_vowel]}
  - {ipa: "ʒ", latin: ge, following: [back_vowel]}
  - {ipa: "ʒ", latin: j}
  # /ʃ/: always "ch" -- real French has exactly one spelling for this
  # sound (chat, chien, chose). Previously uncurated here, which meant it
  # fell through to the generic diacritic-style category's fallback
  # table ("š", Slavic-style) -- correct for nobody in this project, and
  # specifically wrong for French.
  - {ipa: "ʃ", latin: ch}
  # /k/: always "qu" before a front vowel (qui, que, quel, quinze,
  # quitter -- never "ki"/"ke", which would look foreign) -- a silent-u
  # convention, not a real /w/ phoneme (unlike Italian/English/German's
  # own k+w cluster, French "quoi"/"pourquoi" is the rare genuine
  # exception with a real /w/, too narrow a word family to curate here).
  # Elsewhere, plain "c" is the dominant native spelling (comme, cou,
  # cage); "k" is loanword-only (kilo, kayak, koala), same "don't
  # fabricate a competing alternative for a loanword letter" call as
  # German's own excluded loanword "c".
  - {ipa: k, latin: qu, following: [front_vowel]}
  - {ipa: k, latin: c}
  # /s/: real French genuinely splits lexically between two vowels --
  # "ss" is the majority pattern (poisson, laisser, tissu, chaussure),
  # but "c"/"ç" also occurs intervocalically before a front/back vowel
  # respectively (ici, garçon) with no way to predict which from context
  # alone. Elsewhere (word-initial, after a consonant, word-final) plain
  # "s" is the only real spelling.
  - {ipa: s, latin: ss, preceding: [vowel], following: [vowel], weight: 0.7}
  - {ipa: s, latin: c, preceding: [vowel], following: [front_vowel], weight: 0.3}
  - {ipa: s, latin: "ç", preceding: [vowel], following: [back_vowel], weight: 0.3}
  - {ipa: s, latin: s}
  # /o/: three real spellings, no phonological rule to predict which --
  # vélo/zéro/rose vs. chaud/jaune/faute vs. beau/eau/chapeau.
  - {ipa: o, latin: o, weight: 0.45}
  - {ipa: o, latin: au, weight: 0.30}
  - {ipa: o, latin: eau, weight: 0.25}
  # /ɛ/: four real spellings, likewise unpredictable from context --
  # mère/père, tête/forêt, lait/mais/français, neige/treize.
  - {ipa: "ɛ", latin: "è", weight: 0.30}
  - {ipa: "ɛ", latin: "ê", weight: 0.20}
  - {ipa: "ɛ", latin: ai, weight: 0.35}
  - {ipa: "ɛ", latin: ei, weight: 0.15}
  # /e/ word-final: "-er"/"-ez" are real, common, non-verb-specific
  # patterns (boulanger, danger; chez, nez, assez) alongside plain "é" --
  # distinct from the separate verb-infinitive mute-r suffix mechanism
  # above (mute_suffix_by_pos), which just appends a silent "r" after
  # whichever spelling wins here. Elsewhere, plain "é" is the only real
  # spelling.
  - {ipa: e, latin: "é", following: [boundary], weight: 0.5}
  - {ipa: e, latin: er, following: [boundary], weight: 0.3}
  - {ipa: e, latin: ez, following: [boundary], weight: 0.2}
  - {ipa: e, latin: "é"}
  # /w/ before /i/ or /ɛ/ (oui, ouest): "ou" per-phoneme, independently
  # spelled -- already correct as-is, no joint convention needed here.
  # /w/+/a/ (moi, roi, voix) is handled separately, below, as a genuine
  # *joint* spelling (onset_nucleus_spellings) -- NOT here as a
  # following-conditioned rule on /w/ alone: that would only override
  # /w/'s own slot while /a/ still appended its own separate "a" right
  # after, wrongly producing "moia" instead of real "moi". Not
  # manufacturing an "oui"-as-joint-spelling rule either -- real French
  # /wi/ isn't reliably "oui" (kiwi spells the same sequence "wi"), so
  # that's genuinely lexical/inconsistent, not a convention to hardcode.
  - {ipa: w, latin: ou}
  # /i/: "y" is a real minor alternative in Greek-derived loanwords
  # (stylo, type); plain "i" is overwhelmingly dominant otherwise.
  - {ipa: i, latin: i, weight: 0.9}
  - {ipa: i, latin: y, weight: 0.1}
  # /y/ and /u/ -- previously uncurated here (falling back to plain
  # identity "y"/"u", which is wrong: real French /y/ is essentially
  # always spelled "u" (lune, tu, sur), and real French /u/ is spelled
  # "ou" (vous, nous, tout) -- deterministic, no meaningful alternation.
  - {ipa: y, latin: u}
  - {ipa: u, latin: ou}
  # This profile's own remaining non-ASCII vowels/consonants -- no
  # meaningful free variation, one real spelling each.
  - {ipa: "ɑ", latin: "â"}
  - {ipa: "ɔ", latin: o}
  - {ipa: "ø", latin: eu}
  - {ipa: "œ", latin: eu}
  - {ipa: "ə", latin: e}
  - {ipa: "ɲ", latin: gn}
  - {ipa: "ʁ", latin: r}
core_vocabulary_average_syllables: 1.35  # hand-counted across this project's own CORE_MEANINGS glosses -- between English and German, reflecting a mix of monosyllabic (eau, feu) and longer Latinate (animal, poisson) core words
onset_frequency_tiers:
  very_common: ["ʁ", s]  # French's only rhotic, in nearly every infinitive verb; s- broadly productive
  common: [p, t, k, b, d, g, f, v, m, n, l, j, w, "ʃ", "ʒ"]  # "ʒ" (je-family) is a broad, productive class here, unlike English /ð/'s closed set
  uncommon: [z]
  rare: ["ɲ"]  # gn- word-initial is rare -- almost all /ɲ/ is medial (montagne, ligne, agneau)
coda_frequency_tiers:
  very_common: ["ʁ", l]  # -er/-ir agent-noun/infinitive productivity; le/la/les-family productivity carries l into codas too
  common: [s, n, t, d, k, p, b, g, f, v, m, "ʃ", "ʒ", j]
  uncommon: [z]
  rare: ["ɲ"]
nucleus_frequency_tiers:
  very_common: ["ə", a]
  common: [e, "ɛ", i, u, o]
  uncommon: ["ɔ", "ɑ"]
  rare: [y, "ø", "œ"]
