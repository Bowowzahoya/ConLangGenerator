name: Hawaiian
# No word_classes curated, deliberately -- real Hawaiian, like other
# Polynesian languages, is strongly analytic/isolating: nouns and verbs
# carry no citation-form declension/conjugation marking at all, with
# tense-aspect-mood and case instead marked by separate preposed
# particles (e.g. real ua/e/ke marking verb TAM, real ke/ka/nā marking
# noun case/number). See mandarin.yaml's own note for why an empty
# word_classes here doesn't suppress generation.word_class_gen's own
# generic invented-class roll for an unmatched/uncurated POS.
consonants: [p, k, "ʔ", h, m, n, l, w]
vowels: [i, a, u, e, o, "iː", "aː", "uː", "eː", "oː"]
# Real, major gap this batch fixes: Hawaiian is one of the most-cited
# phonemic-vowel-length languages in introductory linguistics (kane
# "husband-ish" vs. kāne "man"), and this profile previously had none
# curated at all. The shared long-vowel pool (aː/iː/uː/eː/oː) already
# covers exactly Hawaiian's own five long vowels -- no new phonemes
# needed, just adding them here and the real macron spelling below.
coda_profile: none
max_onset: 1
tonal: false
stress_pattern: lexical
stress_deviation_rate: 0.18  # illustrative -- real Hawaiian stress is weight-sensitive (a long vowel or diphthong reliably attracts it, building a moraic-trochee pattern right-to-left) rather than a simple fixed position, the same "quantity-sensitive, no flat rule" shape this project's own Arabic/Hindi profiles already use -- but noticeably lower than Hindi's own 0.40, since Hawaiian's own weight-sensitivity is considerably more mechanically regular once vowel length is known
orthography_category: scholarly-macron-style
orthography:
  # The real ʻokina character (U+02BB MODIFIER LETTER TURNED COMMA), not
  # a plain apostrophe.
  - {ipa: "ʔ", latin: "ʻ"}
  # Real kahakō (macron) vowel-length spelling -- the same convention
  # this project's own Nahuatl profile already curates.
  - {ipa: "aː", latin: "ā"}
  - {ipa: "iː", latin: "ī"}
  - {ipa: "uː", latin: "ū"}
  - {ipa: "eː", latin: "ē"}
  - {ipa: "oː", latin: "ō"}
core_vocabulary_average_syllables: 2.45  # hand-counted across this project's own CORE_MEANINGS glosses (wai "water"=2, ahi "fire"=2, kanaka "person"=3, makuahine "mother"=4) -- a real, strictly-CV-only language with no clusters or codas at all ever needs more syllables to encode the same information, running longer than most Eurasian languages already curated; illustrative, more counting uncertainty than the perfected profiles, same caveat as every newly-added language
onset_frequency_tiers:
  very_common: [m, n, l, k]
  common: [p, w, h]
  uncommon: ["ʔ"]
  rare: []  # this profile's own tiny 8-consonant inventory has nothing left for this tier
nucleus_frequency_tiers:
  very_common: [a, i]
  common: [u, e, "aː"]
  uncommon: [o, "iː", "uː"]
  rare: ["eː", "oː"]

# --- Grammar-level typology (source_language bias in grammar_gen.py) ---
real_word_order: VSO                 # canonical for Polynesian languages generally, well-documented for Hawaiian
real_alignment: null                 # real Hawaiian's own alignment is genuinely debated in the literature (its pronoun system reads mostly nominative-accusative, but some constructions have been argued to show ergative-like patterns) -- honestly left uncurated rather than picking a side of a real academic disagreement
real_has_articles: true              # ka/ke (definite), he (indefinite) -- real, grammaticalized articles
real_has_overt_copula: false         # real Hawaiian predicate-adjective sentences use the stative/adjective itself in the verbal-predicate slot (ua ki'eki'e ka mauna = "the mountain is tall") -- no separate copula lexeme
real_adjective_after_noun: true      # real Hawaiian modifiers follow the noun (mauna ki'eki'e = "tall mountain")
real_case_count: null                # real Hawaiian marks grammatical relations with preposed case-marking particles, not fused inflectional suffixes -- same abstention reasoning as Japanese/Korean's own profiles
foreign_name_handling: adapt      # borrowings are fitted to Hawaiian's tiny inventory
