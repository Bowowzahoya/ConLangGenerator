name: Arabic
aliases: [modern standard arabic]
consonants: [b, t, d, k, q, "ʔ", "dʒ", m, n, s, "ʃ", x, "ɣ", z, f, h, "ħ", "ʕ", l, r, j, w, "θ", "ð", "tˤ", "dˤ", "sˤ", "ðˤ", "kː", "tː", "sː", "nː", "lː", "zˤ", "lˤ", "mː", "jː", "rː", "dː", "bː", "dˤː", "sˤː", "qː", "fː", "wː", "tˤː", "zː", "zˤː"]
vowels: [i, a, u, "aː", "iː", "uː", ai, au]
final_geminates: true  # shadda ends words too (habb, hubb)
coda_profile: unrestricted
max_onset: 1
tonal: false
root_and_pattern: true
word_classes:
  # Real MSA feminine marker (تاء مربوطة, tāʾ marbūṭa) -- a genuinely
  # real, extremely common noun-citation-form suffix, /-a/ in pause
  # form. Curated despite this profile's own root_and_pattern: true,
  # since word_classes operates orthogonal to (on top of) whatever stem
  # the templatic system already built -- unlike an *invented* class,
  # which this profile's own real Semitic morphology deliberately stays
  # excluded from (see generation/word_class_gen.py's own docstring).
  # No verb classes curated: real Arabic verb citation-form variation is
  # entirely the templatic Form I-X system already modeled via
  # WordTemplate, not a suffix-class layer on top of it.
  - {name: "masculine (unmarked)", pos: noun, prevalence: 0.65}
  - {name: "feminine (-a)", pos: noun, suffix: [a], prevalence: 0.35}
word_class_deviation_rate: 0.15  # illustrative -- the -a marker is a strong, reliable real signal, but real natural-gender feminine nouns without it exist too (umm "mother", arḍ "land")
restricted_onset_consonants: []  # real Arabic shadda (gemination) is a medial/intervocalic phenomenon -- a word never *starts* with a geminated consonant, same fact already curated for Finnish's own geminates
restricted_initial_consonants: ["kː", "tː", "sː", "nː", "lː", "mː", "jː", "rː", "dː", "bː", "dˤː", "sˤː", "qː", "fː", "wː", "tˤː", "zː", "zˤː"]  # geminates never open a word (medial only), but may open a later syllable
restricted_coda_consonants: [j, w]  # real Arabic coda /j//w/ (bayt "house", yawm "day") form a diphthong with the preceding vowel rather than closing the syllable as a true consonant -- same real fact already curated for English's own restricted_coda_consonants
attested_coda_clusters:
  # Real, common Arabic coda clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive.
  - [l, b]                   # "qalb" (heart)
  - [s, m]                   # "ism" (name)
  - [r, b]                   # "ḥarb" (war)
  - [l, m]                   # "ʕilm" (knowledge)
  - [q, t]                   # "waqt" (time)
  - [h, r]                   # "šahr" (month)
  # real clusters found by `conlang audit-lexicons`
  - ["ʕ", d]
  - ["ʔ", s]
  - ["ħ", m]
