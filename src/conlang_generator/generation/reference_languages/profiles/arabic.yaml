orthography_category: scholarly-macron-gemination-style  # real Arabic transliteration marks both vowel length (macron) and shadda/gemination (doubled letter) in the same system -- see romanization_gen.py's own category
orthography:
  # Real (scholarly/IJMES-style) Arabic transliteration conventions,
  # restricted to symbols this profile actually models -- illustrative,
  # not a full account. Phonemic vowel length is genuine same-quality
  # duration here (unlike Dutch's quality-shifted length marking), spelled
  # with the standard macron convention. Not curating "kː"/"tː"/"sː"/"nː"/"lː"
  # here -- this profile's own category already generates a doubling
  # rule for each structurally, same reasoning Finnish/Italian's own
  # gemination-style profiles already give.
  - {ipa: "aː", latin: "ā"}
  - {ipa: "iː", latin: "ī"}
  - {ipa: "uː", latin: "ū"}
  # Emphatic (pharyngealized) consonants -- the classic dot-under
  # transliteration for ط ص ض ظ.
  - {ipa: "tˤ", latin: "ṭ"}
  - {ipa: "sˤ", latin: "ṣ"}
  - {ipa: "dˤ", latin: "ḍ"}
  - {ipa: "ðˤ", latin: "ẓ"}
  # Pharyngeals and glottal stop.
  - {ipa: "ħ", latin: "ḥ"}
  - {ipa: "ʕ", latin: "ʿ"}
  - {ipa: "ʔ", latin: "'"}
  - {ipa: x, latin: kh}
  - {ipa: "ɣ", latin: gh}
  - {ipa: "dʒ", latin: j}  # real MSA jīm is voiced /dʒ/ (dialects vary: Egyptian /g/, Levantine /ʒ/) -- "j" is the standard IJMES-style transliteration
  - {ipa: "θ", latin: th}  # ث
  - {ipa: "ð", latin: dh}  # ذ
core_vocabulary_average_syllables: 1.6  # hand-counted across this project's own CORE_MEANINGS glosses -- illustrative, more counting uncertainty than the perfected profiles, same caveat as every newly-added language
onset_frequency_tiers:
  very_common: [t, k, m, n, s, l, r, b]
  common: [d, f, h, q, w, j, z, "ʔ"]
  uncommon: [x, "ɣ", "ʃ", "dʒ", "θ", "ð", "ħ", "ʕ"]
  rare: ["tˤ", "dˤ", "sˤ", "ðˤ", "zˤ", "lˤ", "kː", "tː", "sː", "nː", "lː", "mː", "jː", "rː", "dː", "bː", "dˤː", "sˤː", "qː", "fː", "wː", "tˤː", "zː", "zˤː"]  # the geminate series, this position's only other candidates, is excluded from onset entirely (see restricted_onset_consonants above) -- nothing legal left for that slot
nucleus_frequency_tiers:
  very_common: [a, i]
  common: [u, "aː"]
  uncommon: ["iː", "uː"]
  rare: [ai, au]
coda_frequency_tiers:
  very_common: [t, n, m, s, r, l]
  common: [b, d, k, q, f, h, z, "ʕ", "ħ"]
  uncommon: [x, "ɣ", "ʃ", "dʒ", "θ", "ð", "ʔ"]
  rare: ["tˤ", "dˤ", "sˤ", "ðˤ", "zˤ", "lˤ", "kː", "tː", "sː", "nː", "lː", "mː", "jː", "rː", "dː", "bː", "dˤː", "sˤː", "qː", "fː", "wː", "tˤː", "zː", "zˤː"]
stress_pattern: lexical  # real Arabic stress is genuinely quantity-sensitive (heavy syllables attract stress), not a flat position -- none of this project's other four patterns capture that; modeled the same "genuinely complex, no simple flat rule" way English's own real stress system is
stress_deviation_rate: 0.35  # illustrative -- lower than English's own 0.5 (real Arabic's heavy-syllable rule is meaningfully more predictive in practice than English's genuinely idiosyncratic system, even though neither is a flat position)
stress_driven_vowel_reduction: false  # real Arabic: keeps comparatively full vowel quality regardless of stress, unlike English/German/Dutch

# --- Grammar-level typology (source_language bias in grammar_gen.py) ---
real_word_order: VSO                 # the traditional/Classical and Modern Standard Arabic citation order -- many colloquial varieties favor SVO instead, an honest simplification for this project's own single-value field
real_alignment: nominative_accusative
real_has_articles: true              # al- -- a real, grammaticalized (if prefixal, not a separate word) definite article; no indefinite article, but the boolean is about having *an* article system at all
real_has_overt_copula: false         # real Arabic present-tense nominal/adjectival predicate sentences are genuinely zero-copula (huwa taweel = "he (is) tall")
real_adjective_after_noun: true      # real Arabic attributive adjectives follow the noun (al-bait al-kabir = "the house the-big")
real_case_count: 3                   # nominative, accusative, genitive -- the real Classical/MSA i'rab system (largely unmarked in speech, but the standard citation count)
