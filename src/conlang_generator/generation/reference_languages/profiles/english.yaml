name: English
consonants: [p, b, t, d, k, g, "tʃ", "dʒ", f, v, s, z, "ʃ", "ʒ", "θ", "ð", h, m, n, "ŋ", l, r, j, w]
vowels: [i, "ɪ", e, "ɛ", "æ", "ɑ", "ɔ", o, u, "ʊ", "ə", "ɐ", ai, au, "ɔi", ei]
coda_profile: unrestricted
max_onset: 2
tonal: false
orthography_category: silent-e-style
stress_pattern: lexical  # real English stress is largely unpredictable from a word's shape alone (real/heavy noun/verb pairs like REcord/reCORD are a further refinement this project doesn't model -- see stress_gen.py)
stress_deviation_rate: 0.5  # illustrative -- genuinely close to a coin flip relative to any single default, the least rule-governed of the six curated profiles
restricted_onset_consonants: ["ŋ", "ʒ"]  # /ŋ/ is coda/medial-only; /ʒ/ word-initial is loanword-only (genre, jete)
restricted_coda_consonants: [j, w]  # what looks like a word-final glide in English spelling ("cow", "day") is really part of a diphthong vowel (ai/au/ɔi/ei), not a true consonant coda
restricted_onset_nucleus_pairs:
  # Real English labial dissimilation: "dw-"/"tw-"/"kw-"/"gw-" (and plain
  # "w-") never precede a rounded vowel -- "dwoo"/"dwo" isn't a real
  # combination, but "dwe"/"dwa"-shaped ones are (dwell, dwarf). Keyed on
  # the shared final onset consonant "w", so this covers every cluster
  # ending in it uniformly, not just one specific cluster.
  - [w, u]
  - [w, o]
  - [w, "ʊ"]
  - [w, "ɔ"]
restricted_nucleus_coda_pairs:
  # Real English /ŋ/ only closes a syllable after a lax/checked vowel
  # (sing, sung, hang, song) -- never a tense vowel or diphthong (no
  # native "seeng"/"sayng"/"sowng"). Keyed on every tense vowel/diphthong
  # this profile models.
  - [i, "ŋ"]
  - [e, "ŋ"]
  - [u, "ŋ"]
  - [o, "ŋ"]
  - ["ə", "ŋ"]
  - [ai, "ŋ"]
  - [au, "ŋ"]
  - ["ɔi", "ŋ"]
  - [ei, "ŋ"]
attested_onset_clusters:
  # Real, common English onset clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive (only used when
  # source_language_strictness > 0). s + voiceless stop (sp/st/sk) is
  # already handled generically by sonority.is_legal_onset_cluster's own
  # special case, so it's not duplicated here.
  - [p, l]                   # "play"
  - [p, r]                   # "pray"
  - [b, l]                   # "blue"
  - [b, r]                   # "brown"
  - [t, r]                   # "tree"
  - [d, r]                   # "dream"
  - [t, w]                   # "twin"
  - [d, w]                   # "dwell"
  - [k, l]                   # "clean"
  - [k, r]                   # "cream"
  - [k, w]                   # "queen"
  - [g, w]                   # "penguin"/"language"/"distinguish" -- medial rather than word-initial, but a real, regularly-spelled cluster
  - [g, l]                   # "glow"
  - [g, r]                   # "green"
  - [f, l]                   # "fly"
  - [f, r]                   # "free"
  - [f, j]                   # "few"
  - [v, j]                   # "view"
  - ["θ", r]                  # "three"
  - [s, l]                   # "sleep"
  - [s, m]                   # "small"
  - [s, n]                   # "snow"
  - [s, w]                   # "swim"
  - ["ʃ", r]                  # "shrimp"
attested_coda_clusters:
  # Real, common English coda clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive.
  - [m, p]                   # "jump"
  - [n, t]                   # "want"
  - [n, d]                   # "hand"
  - [n, s]                   # "dance"
  - ["ŋ", k]                  # "think"
  - [l, p]                   # "help"
  - [l, t]                   # "belt"
  - [l, k]                   # "milk"
  - [l, f]                   # "self"
  - [l, m]                   # "film"
  - [l, d]                   # "cold"
  - [l, v]                   # "twelve"
  - [r, p]                   # "harp"
  - [r, t]                   # "heart"
  - [r, k]                   # "park"
  - [r, m]                   # "harm"
  - [r, n]                   # "barn"
  - [r, d]                   # "hard"
  - [r, v]                   # "carve"
  - [r, s]                   # "curse"
  - [s, p]                   # "wasp"
  - [s, t]                   # "fist"
  - [s, k]                   # "ask"
  - [p, s]                   # "lapse"
  - [t, s]                   # "guts"
  - [k, s]                   # "box"
  - [f, t]                   # "left"
  - [p, t]                   # "kept"
  - [k, t]                   # "act"
orthography:
  # Real English spelling conventions, restricted to symbols this
  # profile actually models -- illustrative, not a full account (real
  # English spelling has enormous lexical/etymological irregularity this
  # project's rule system can't capture at all). Several sounds below
  # have genuinely more than one real spelling with no phonological rule
  # to predict which -- `weight` picks a reproducible-per-word
  # alternative among ties, it doesn't mean "rare"; omitted entirely
  # where English really does have just one spelling.
  - {ipa: "tʃ", latin: ch}
  # /dʒ/: real English splits before a front vowel (gem/giant/gym vs.
  # jet) with no rule to predict which; elsewhere (jump/join) plain "j".
  - {ipa: "dʒ", latin: g, following: [front_vowel], weight: 0.5}
  - {ipa: "dʒ", latin: j, following: [front_vowel], weight: 0.5}
  - {ipa: "dʒ", latin: j}
  - {ipa: "ʃ", latin: sh}
  - {ipa: "ʒ", latin: zh}
  - {ipa: "θ", latin: th}
  - {ipa: "ð", latin: th}    # real English spells both th-sounds the
                              # same way ("thin" vs. "this")
  - {ipa: "ŋ", latin: ng}
  - {ipa: "ɛ", latin: e}
  - {ipa: "ɪ", latin: i}
  - {ipa: "ʊ", latin: oo}    # "book"
  - {ipa: "ɔ", latin: o}
  - {ipa: "ɑ", latin: a}
  - {ipa: "æ", latin: a}
  # /ə/ (schwa): the single most famous fact about English spelling --
  # it's written with almost any vowel letter depending on the word, with
  # no rule to predict which (about/sofa, item/silent, lemon/gallop,
  # focus/circus, pencil/edible).
  - {ipa: "ə", latin: a, weight: 0.30}
  - {ipa: "ə", latin: e, weight: 0.30}
  - {ipa: "ə", latin: o, weight: 0.20}
  - {ipa: "ə", latin: u, weight: 0.10}
  - {ipa: "ə", latin: i, weight: 0.10}
  - {ipa: "ɐ", latin: u}     # real English /ʌ/ ("cup"), approximated by
                              # this project's near-open central vowel
  # /ai/: "igh" (night, light, right, sight) is real only immediately
  # before /t/, or -- a much smaller set -- word-finally (high, sigh,
  # thigh); "y" is genuinely flexible everywhere (my/by word-final,
  # type/style/cycle before another consonant) but is real English's
  # dominant word-final spelling too (my/by/cry/dry/fly/spy/try/why is a
  # bigger set than high/sigh/thigh), so it needs its own word-final
  # entry rather than losing that position outright to the more specific
  # "igh" rule. English *also* spells this vowel via the silent-e pattern
  # (time, mine, side), which would need the existing
  # `VowelLengthStrategy.SILENT_E` deferred-marker mechanism wired to
  # English's own vowel set (currently inert for English -- none of its
  # modeled vowel qualities carry the `long` flag that mechanism keys
  # on) -- a separate architectural decision, not folded in here.
  - {ipa: ai, latin: igh, following: ["t"]}                      # "night"/"light"/"right" -- deterministic
  - {ipa: ai, latin: y, following: [boundary], weight: 0.75}     # "my"/"by"/"cry"/"why"
  - {ipa: ai, latin: igh, following: [boundary], weight: 0.25}   # "high"/"sigh"/"thigh"
  - {ipa: ai, latin: y}                                            # "type"/"style"/"cycle" -- elsewhere
  - {ipa: au, latin: ow}     # "cow"
  # /ɔi/ and /ei/: each has a real two-way positional split -- "oy"/"ay"
  # before a vowel or at a word's end (boy/toy/royal, day/way/player),
  # "oi"/"ai" before a consonant (point/voice/join, rain/wait/train) --
  # not a genuine lexical alternation the way the weighted vowels above
  # are, just a structural fact about which spelling a given position
  # allows, so no `weight` needed.
  - {ipa: "ɔi", latin: oy, following: [vowel, boundary]}   # "boy"/"toy"/"royal"
  - {ipa: "ɔi", latin: oi, following: [consonant]}          # "point"/"voice"/"join"
  - {ipa: ei, latin: ay, following: [vowel, boundary]}      # "day"/"way"/"player"
  - {ipa: ei, latin: ai, following: [consonant]}            # "rain"/"wait"/"train"
  # /i/: "ee"/"ea"/"ie" are all genuinely flexible both word-finally
  # (free/tree, sea/tea, movie/genie) and before a consonant (green/
  # sleep, meat/dream, piece/chief) -- no restriction needed. Bare "e"
  # (be/he/we/she) is real only word-finally -- a small closed pronoun/
  # copula class -- so unlike the other three it needs the boundary
  # condition rather than just a low flat weight (which could otherwise
  # fire mid-word, e.g. a hypothetical "smiv"->"smev").
  - {ipa: i, latin: ee, following: [boundary], weight: 0.35}
  - {ipa: i, latin: ea, following: [boundary], weight: 0.30}
  - {ipa: i, latin: ie, following: [boundary], weight: 0.20}
  - {ipa: i, latin: e, following: [boundary], weight: 0.15}   # "be"/"he"/"we"/"she"
  - {ipa: i, latin: ee, weight: 0.40}
  - {ipa: i, latin: ea, weight: 0.35}
  - {ipa: i, latin: ie, weight: 0.25}
  # /u/: "ew"/"ue" (new/few, blue/true) are real only word-finally --
  # never before a following consonant (no real "sewv"-shaped word).
  # "oo"/"u"/"o" are genuinely flexible both ways (moon/zoo, rule/menu,
  # move/who), each at different relative weights per context.
  - {ipa: u, latin: ew, following: [boundary], weight: 0.30}   # "new"/"few"/"chew"/"grew"
  - {ipa: u, latin: ue, following: [boundary], weight: 0.25}   # "blue"/"true"/"glue"
  - {ipa: u, latin: oo, following: [boundary], weight: 0.30}   # "zoo"/"too"/"boo"
  - {ipa: u, latin: o, following: [boundary], weight: 0.15}    # "who"/"do"/"two"
  - {ipa: u, latin: oo, weight: 0.55}    # "moon"/"food"/"school"/"boot"/"tooth"
  - {ipa: u, latin: u, weight: 0.25}     # "rule"/"truth"/"June"/"flute"
  - {ipa: u, latin: o, weight: 0.20}     # "move"/"prove"/"lose"/"tomb"
  # /o/: "oa" (boat/road/coat) is real only before a following
  # consonant -- no real "boa"-as-a-common-word shape word-finally.
  # "oe" (toe/doe/hoe/foe) is the mirror image -- real only word-finally.
  # "o"/"ow" are genuinely flexible both ways (go/most, grow/own) but at
  # different relative weights per context ("ow" is more common
  # word-finally -- grow/know/show/snow -- than in the smaller "-own"
  # coda family -- own/grown/known -- and is genuinely ambiguous with
  # /au/'s own "ow" in real English too -- "know" vs. "cow" -- a real
  # irregularity, not a bug, since these come from different IPA symbols
  # here).
  - {ipa: o, latin: o, following: [boundary], weight: 0.45}    # "go"/"no"/"so"
  - {ipa: o, latin: ow, following: [boundary], weight: 0.35}   # "grow"/"know"/"show"/"snow"
  - {ipa: o, latin: oe, following: [boundary], weight: 0.20}   # "toe"/"doe"/"hoe"/"foe"
  - {ipa: o, latin: o, weight: 0.30}      # "most"/"post"/"cold"/"gold"/"host"
  - {ipa: o, latin: oa, weight: 0.40}     # "boat"/"road"/"coat"/"goat"/"soap"
  - {ipa: o, latin: ow, weight: 0.30}     # "own"/"grown"/"known"/"shown"/"thrown"
  # /k/: "k" is preferred before a front vowel specifically to avoid the
  # letter "c" reading as its own soft /s/ there (keep/kid/key, not
  # *ceep/*cid/*cey) -- deterministic. Elsewhere real English splits
  # between "c" (dominant: cat/cup/class), "k" (kangaroo), and
  # word-final-after-a-short-vowel "ck" (back/pick/rock -- approximated
  # here as a flat alternative, since this project's condition system
  # doesn't have the full short-vowel-coda compound condition that real
  # rule actually needs).
  - {ipa: k, latin: k, following: [front_vowel]}
  - {ipa: k, latin: q, following: ["w"]}  # "queen"/"quick"/"aqueduct" -- real English /kw/ is always "qu", regardless of the vowel that follows
  - {ipa: k, latin: c, weight: 0.55}
  - {ipa: k, latin: k, weight: 0.30}
  - {ipa: k, latin: ck, weight: 0.15}
  # /w/ after /k/ or /g/ (queen/quick/aqueduct; penguin/language/
  # distinguish): real English spells this "u", not "w" -- /w/'s own
  # plain elsewhere spelling ("wind", "way") is untouched.
  - {ipa: w, latin: u, preceding: ["k"]}
  - {ipa: w, latin: u, preceding: ["g"]}
  # /s/: real English is genuinely mixed before a front vowel (sit/see/
  # sing vs. cent/city/cell) -- not rule-governed the way /ʃ/ etc. are.
  # Elsewhere, plain "s" is the only real spelling.
  - {ipa: s, latin: s, following: [front_vowel], weight: 0.55}
  - {ipa: s, latin: c, following: [front_vowel], weight: 0.45}
  - {ipa: s, latin: s}
  # /z/: real English very commonly spells this intervocalically as "s"
  # (rose/use/busy/easy) alongside plain "z" (lazy/dozen) -- a hugely
  # common, genuinely unpredictable pattern. Elsewhere, plain "z".
  - {ipa: z, latin: s, preceding: [vowel], following: [vowel], weight: 0.5}
  - {ipa: z, latin: z, preceding: [vowel], following: [vowel], weight: 0.5}
  - {ipa: z, latin: z}
  # /f/: "ph" in Greek-derived words (phone/graph/photo) is real but
  # minor next to plain "f".
  - {ipa: f, latin: f, weight: 0.85}
  - {ipa: f, latin: ph, weight: 0.15}
core_vocabulary_average_syllables: 1.14  # hand-counted across this project's own CORE_MEANINGS glosses -- the shortest of the four perfected languages, reflecting English's aggressive historical apocope
onset_frequency_tiers:
  # By word-type productivity (how many distinct words use this sound
  # here), not token/corpus frequency -- /ð/ is extremely frequent in
  # running text (the/this/that/these/those/then/than/there/they) but
  # is one of the smallest onset classes by word-type count.
  very_common: [s, t, k, p, b]
  common: [d, m, f, r, l, w, g, h, n, v]
  uncommon: [j, "ʃ", "tʃ", "dʒ", "θ"]
  rare: ["ð", z]
coda_frequency_tiers:
  # /ŋ/ is very_common here despite being excluded from onset entirely --
  # the "-ing" suffix is one of the most productive patterns in the
  # language, a real type-frequency fact independent of token frequency.
  very_common: [t, d, s, z, n, "ŋ"]
  common: [r, l, m, k, p, b, g, f, v]
  uncommon: ["ʃ", "tʃ", "dʒ", "θ", "ð"]
  rare: [h, "ʒ"]
nucleus_frequency_tiers:
  very_common: ["ə", "ɪ", i]
  common: ["æ", "ɐ", "ɛ", ai, ei]
  uncommon: ["ɑ", "ɔ", o, u, au]
  rare: ["ʊ", "ɔi", e]
