name: Xhosa
aliases: [click language]
# "zulu" used to live here as a bare alias -- a pre-existing conflation
# this batch corrects. Zulu and Xhosa are separately standardized
# languages (ISO zul vs xho) with real differences at the level this
# project curates (Xhosa's own aspirated/affricate series is more
# elaborate; its orthography has conventions Zulu's doesn't) -- closer
# to a real conflation than Serbo-Croatian's own deliberate unification,
# so Zulu now has its own profile (see zulu.yaml). "nguni" (the
# language-family name covering Zulu/Xhosa/Swati/Ndebele) is dropped
# too for the same reason -- it's not specifically Xhosa either.
consonants: [p, b, t, d, k, g, "tʃ", "dʒ", "ʔ", m, n, "ŋ", s, "ʃ", h, z, l, j, w, "ǀ", "ǃ", "ǁ", "ǀʰ", "ǃʰ", "ǁʰ", "ɡǀ", "ɡǃ", "ɡǁ", "ŋǀ", "ŋǃ", "ŋǁ"]
# The real click-accompaniment series Zulu's own profile curates this
# same session -- aspirated, voiced/breathy "depressor", and nasalized
# -- applies the same real Nguni-wide way to Xhosa's own three click
# places (dental ǀ, postalveolar ǃ, lateral ǁ), using the exact symbols
# already added to the shared pool for Zulu; no new phonemes needed.
# The real palatoalveolar click (ǂ) has no standard letter in either
# Nguni language and was previously (inconsistently) left in this
# profile's own consonant list despite that -- dropped here to match
# Zulu's own choice.
#
# Xhosa's own plain stop series (b/d/g vs. p/t/k, a genuine 2-way
# voiced/voiceless contrast) stays as originally curated here, distinct
# from Zulu's own real 3-way plain/aspirated/breathy-depressor system
# -- research for this batch didn't confirm Xhosa's stops work
# identically to Zulu's, so this isn't force-matched to Zulu's own
# shape.
vowels: [i, a, u, e, o]
coda_profile: none
# Corrected from "sonorant": Zulu (Xhosa's closest sister, curated
# earlier this session) is a real, well-documented open-syllable
# (CV-only) Bantu-wide-canon language, and that same real fact applies
# to Xhosa -- the same real syllabic-nasal-prefix exception noted in
# Zulu's own comment applies identically here too, and stays out of
# scope for the same reason.
max_onset: 1
tonal: true
tone_level_count: 2
# Same real 2-level H/L register system standard Nguni tonology already
# gives Zulu -- Xhosa tonology is analyzed the same way.
word_classes:
  # Real Xhosa noun-class prefix system -- the same representative
  # subset Zulu's own profile curates, with Xhosa's own real, genuinely
  # distinct class-1 form: "umntu" (person), shorter than Zulu's own
  # "umuntu" -- a real dialectal/phonological difference between the
  # two closely related but separately standardized languages, not an
  # error. Class 5/6 i-/ama- (amanzi "water", cited directly in this
  # profile's own word-length comment above), 7/8 isi-/izi-, 9/10
  # in-/izin- (the real prenasalized-cluster pattern), 11 u- all match
  # Zulu's own real forms.
  - {name: "class 1/2 (um-/aba-)", pos: noun, prefix: [u, m], prevalence: 0.25}
  - {name: "class 5/6 (i-/ama-)", pos: noun, prefix: [i], prevalence: 0.2}
  - {name: "class 7/8 (isi-/izi-)", pos: noun, prefix: [i, s, i], prevalence: 0.2}
  - {name: "class 9/10 (in-/izin-)", pos: noun, prefix: [i, n], prevalence: 0.2}
  - {name: "class 11 (u-)", pos: noun, prefix: [u], prevalence: 0.15}
word_class_deviation_rate: 0.2  # illustrative -- same figure and reasoning as Zulu's own (a representative subset of the real ~15 Nguni classes)
orthography_category: digraph-style
# Corrected from "monoletter-style", for the exact same reason Zulu's
# own profile already made this call: the real aspirated-click/
# aspirated-stop convention needs a genuine h-suffix digraph treatment
# that monoletter-style's own generic default would otherwise collapse.
orthography:
  # The three real Xhosa click letters -- c (dental), q (postalveolar),
  # x (lateral) -- single ASCII letters, overriding this category's own
  # generic digraph default (which would otherwise spell ǁ "xh", not
  # "x").
  - {ipa: "ǀ", latin: c}
  - {ipa: "ǃ", latin: q}
  - {ipa: "ǁ", latin: x}
  # Real Nguni click-accompaniment conventions, the same ones Zulu's own
  # profile curates: voiced/depressor clicks prefix "g", nasal clicks
  # prefix "n". Aspirated clicks modeled as an "h" suffix on the plain
  # click letter, by analogy with the aspirated-stop convention below --
  # inferred, not directly confirmed by a source giving this exact
  # spelling, same honesty flag Zulu's own profile already carries.
  - {ipa: "ǀʰ", latin: ch}
  - {ipa: "ǃʰ", latin: qh}
  - {ipa: "ǁʰ", latin: xh}
  - {ipa: "ɡǀ", latin: gc}
  - {ipa: "ɡǃ", latin: gq}
  - {ipa: "ɡǁ", latin: gx}
  - {ipa: "ŋǀ", latin: nc}
  - {ipa: "ŋǃ", latin: nq}
  - {ipa: "ŋǁ", latin: nx}
  - {ipa: "ŋ", latin: ng}
  - {ipa: "ʃ", latin: sh}
  - {ipa: "tʃ", latin: ch}
  - {ipa: "dʒ", latin: j}
core_vocabulary_average_syllables: 2.18  # hand-counted across this project's own CORE_MEANINGS glosses at citation form (root + real noun-class prefix, e.g. amanzi "water", umntu "person") -- close to but not identical to this project's own already-curated Zulu figure (2.22), reflecting the same shared Nguni prefix system rather than a genuinely different typology; illustrative, more counting uncertainty than the perfected profiles, same caveat as every newly-added language
onset_frequency_tiers:
  very_common: [m, n, l, k, t, w, j, s]
  common: [p, b, d, g, z, h, "ŋ", "ǀ", "ǃ", "ǁ"]
  uncommon: ["tʃ", "dʒ", "ʃ", "ʔ", "ǀʰ", "ǃʰ", "ǁʰ"]
  rare: ["ɡǀ", "ɡǃ", "ɡǁ", "ŋǀ", "ŋǃ", "ŋǁ"]
nucleus_frequency_tiers:
  very_common: [a, i]
  common: [u, e]
  uncommon: [o]
  rare: []  # this profile's own vowel set has nothing left for this tier -- same legitimately-empty-tier precedent Persian's own nucleus table already has
