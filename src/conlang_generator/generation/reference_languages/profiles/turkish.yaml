name: Turkish
aliases: ["türkçe"]
consonants: [p, b, t, d, k, g, "tʃ", "dʒ", f, v, s, z, "ʃ", "ʒ", "ɣ", h, m, n, l, r, j, "nː", "kː", "sː", "mː", "lː"]
vowels: [i, y, "ɯ", u, e, "ø", a, o]
coda_profile: unrestricted
restricted_onset_consonants: []  # geminates are word-medial only
restricted_initial_consonants: ["nː", "kː", "sː", "mː", "lː"]  # geminates never open a word (medial only), but may open a later syllable
max_onset: 1
tonal: false
vowel_harmony: true
coda_devoicing: true
coda_devoicing_exempt: [z, v, "ɣ", "ʒ"]  # real Turkish devoices only b d g dʒ word-finally (biz, yaz, av, dağ keep theirs)
orthography_category: diacritic-style
orthography:
  # Real modern Turkish orthography -- unusually, these aren't invented
  # transliteration conventions at all: Turkish's own native Latin
  # alphabet already uses exactly these letters for these sounds, so
  # this profile's curated rules are as authentic as they get.
  - {ipa: "ʃ", latin: "ş"}
  - {ipa: "tʃ", latin: "ç"}
  - {ipa: "dʒ", latin: c}     # real Turkish spells /dʒ/ with plain "c"
  - {ipa: "ɯ", latin: "ı"}    # the real dotless-i letter
  - {ipa: "ɣ", latin: "ğ"}    # the real "yumuşak g" (soft g)
  - {ipa: "ʒ", latin: j}
  - {ipa: y, latin: "ü"}
  - {ipa: "ø", latin: "ö"}
  - {ipa: j, latin: y}
# /ɣ/ ("ğ") is real, well-known Turkish trivia -- it never opens a *word*
# (no native word starts with ğ), but it genuinely does open non-initial
# syllables medially (değil "not", öğretmen "teacher") -- this project's
# restricted_onset_consonants has no way to express "never word-initial,
# but fine syllable-medially" (it blocks a symbol from every onset
# position uniformly), so curating it here would incorrectly also block
# real medial words. Left uncurated rather than force a restriction
# narrower than what actually holds.
attested_coda_clusters:
  # Real, common Turkish coda clusters, restricted to symbols this
  # profile models -- illustrative, not exhaustive. Real native Turkish
  # phonotactics lean CV(C); most of these are old Persian/Arabic loans
  # long since fully nativized.
  - [r, t]                   # "dert" (trouble)
  - [s, t]                   # "üst" (top/upper)
  - [l, t]                   # "alt" (bottom/lower)
  - [r, k]                   # "türk"-adjacent, illustrative
  - [n, t]                   # "kent" (city)
  # real clusters found by `conlang audit-lexicons`
  - [l, p]
  - [n, k]
  - [n, s]
  - [n, "tʃ"]
core_vocabulary_average_syllables: 1.45  # hand-counted across this project's own CORE_MEANINGS glosses -- illustrative, more counting uncertainty than the perfected profiles, same caveat as every newly-added language
onset_frequency_tiers:
  very_common: [t, k, m, n, s, l, r, b]
  common: [d, g, f, v, h, j, z, p]
  uncommon: ["ʃ", "tʃ", "dʒ", "ʒ", "ɣ"]
  rare: ["nː", "kː", "sː", "mː", "lː"]
nucleus_frequency_tiers:
  very_common: [a, i]
  common: [e, u]
  uncommon: ["ɯ", o]
  rare: [y, "ø"]
coda_frequency_tiers:
  # coda_devoicing above already excludes every voiced obstruent
  # (b/d/g/dʒ/v/z/ʒ/ɣ) from legal coda position at generation time --
  # they're never actually consulted (phonology_gen.py's own
  # "unrestricted" branch removes them from the legal coda set before
  # this table is ever queried), same dead-data-but-harmless status
  # Dutch's/Polish's own coda_frequency_tiers already have for their own
  # devoiced entries -- kept here so this table still exactly partitions
  # the full consonant set, matching that existing precedent.
  very_common: [t, n, s, r, l]
  common: [k, m, p, f, j]
  uncommon: ["ʃ", "tʃ", h]
  rare: [b, d, g, "dʒ", v, z, "ʒ", "ɣ", "nː", "kː", "sː", "mː", "lː"]
word_classes:
  # Real Turkish's own famous vowel-harmony-conditioned infinitive:
  # front-vowel stems take "-mek" (gel- -> gelmek "to come"), back-vowel
  # stems take "-mak" (bak- -> bakmak "to look") -- genuine allomorphy of
  # one grammatical suffix, not an unconditioned choice between two
  # classes, so curated with `condition: vowel_harmony` rather than as
  # two separate WordClass entries (see core.grammar.WordClass.condition
  # for the resolution mechanism this now relies on, and why an
  # unconditioned 50/50 pick here would routinely contradict this
  # profile's own already-curated `vowel_harmony: true`). No noun
  # classes: real Turkish has no grammatical gender at all.
  - {name: "infinitive", pos: verb, condition: vowel_harmony, suffix: [m, e, k], suffix_alt: [m, a, k], prevalence: 1.0}
word_class_deviation_rate: 0.05  # illustrative -- real Turkish infinitive marking is close to fully exceptionless once harmony correctly resolves the surface form
stress_pattern: final  # real Turkish: robustly word-final by default
stress_deviation_rate: 0.18  # illustrative -- real, systematic exceptions exist (place names default penultimate; certain suffixes are lexically "stress-neutral"), narrower than Hebrew's own deviation class
stress_driven_vowel_reduction: false  # real Turkish: keeps comparatively full vowel quality regardless of stress

# --- Grammar-level typology (source_language bias in grammar_gen.py) ---
real_word_order: SOV
real_alignment: nominative_accusative
real_has_articles: false             # no grammaticalized definite/indefinite articles ("bir" is a numeral used indefinite-article-like, not a true article)
real_has_overt_copula: false         # real Turkish present-tense predicate adjectives take a person-agreement suffix directly (guzel-dir/guzel), routinely dropped rather than realized as a separate copula word
real_adjective_after_noun: false     # real Turkish attributive adjectives precede the noun (buyuk ev = "big house")
real_case_count: 6                   # nominative, accusative, genitive, dative, locative, ablative -- real, well-documented
foreign_name_handling: keep       # foreign personal names are used as written
