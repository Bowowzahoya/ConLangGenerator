name: Bengali
aliases: [bangla]
consonants: [p, b, t, d, k, g, "tʃ", "dʒ", "pʰ", "tʰ", "kʰ", "bʱ", "dʱ", "gʱ", s, "ʃ", h, m, n, "ŋ", l, r, j, "ɽ", "nː", "tː", "ʃː", "gː", "dʒː", "kː", "lː", "tʃʰ", "dʒʱ", "ʈ", "ʈʰ", "ɖ"]
vowels: [i, e, "ɛ", a, "ɔ", o, u, "ã", "ẽ", "õ"]
final_geminates: true  # real word-final geminates
coda_profile: unrestricted
max_onset: 2
restricted_coda_consonants: []
# Real, well-documented coda restriction: the whole aspirated/breathy
# series essentially never closes a native Bengali syllable -- word-
# final aspiration is phonologically marginal to absent in the modern
# spoken language, the same real status the aspirated series already
# has in this project's own curated Hindi coda facts.
attested_onset_clusters:
  # Real native/tadbhava Bengali vocabulary is strongly onset-simple;
  # true consonant clusters are confined to Sanskrit-loan (tatsama)
  # material -- prem "love", krom "order", gram "village", tran
  # "salvation" -- the same "loanword-derived, biasing not exhaustive"
  # shape this project's own Hindi profile already models for its own
  # real pr/tr clusters.
  - [p, r]
  - [k, r]
  - [g, r]
  - [t, r]
  # real clusters found by `conlang audit-lexicons`
  - ["gʱ", r]
  - [h, r]
  - [d, r]
  - [k, l]
  - [m, r]
  - [b, r]
  - [p, l]
  - [b, l]
  - [g, l]
  - ["ʃ", r]
  - [s, r]
  - [s, t]
  - [s, p]
  - [s, k]
  - [k, "ʃ"]
  - ["ʃ", t]
  - ["dʒ", r]
  - [n, j]
tonal: false
stress_pattern: initial
stress_deviation_rate: 0.15  # illustrative -- real Bengali fixed word-initial stress (primary on the first syllable, secondary on alternating syllables after) is considerably more reliable/exceptionless than Hindi's own quantity-sensitive system (Chatterji; Ferguson & Chowdhury), genuine consensus rather than a live dispute, so this sits well below Hindi's own 0.40
# A real, genuinely distinctive fact stays deliberately unmodeled,
# parallel to Hindi's own already-curated schwa deletion: Bengali's own
# inherent-vowel deletion/reduction (orthographic word-final "অ" /ɔ/ is
# regularly unpronounced, e.g. কম "kom" said without its own final
# inherent vowel, and other schwa-like reductions occur medially) is
# real but not a simple per-symbol rule this project's architecture can
# capture -- the same "real but not currently rule-capturable" status
# every other language's own comparable complexity already gets.
word_classes:
  # Real Bengali famously has no grammatical gender at all (unlike
  # Hindi/Sanskrit) -- no noun word_classes curated, an honest omission
  # matching Hungarian's own genderless fact. Verbs: real Bengali
  # dictionaries and grammars conventionally cite the verb by its own
  # "verbal noun" form, formed with a dominant "-a" suffix (e.g. khawa
  # "to eat", kora "to do") -- distinct from the separate "-te"
  # conjunctive-participle form used in running speech, which isn't the
  # citation form.
  - {name: "-a verbal noun", pos: verb, suffix: [a], prevalence: 0.9}
word_class_deviation_rate: 0.1  # illustrative -- real Bengali verbal-noun formation is fairly regular
orthography_category: scholarly-macron-style
orthography:
  # Real scholarly Bengali transliteration conventions, restricted to
  # symbols this profile actually models -- illustrative, not a full
  # account.
  - {ipa: "tʃ", latin: ch}
  - {ipa: "dʒ", latin: j}
  - {ipa: "ʃ", latin: sh}
  - {ipa: "pʰ", latin: ph}
  - {ipa: "tʰ", latin: th}
  - {ipa: "kʰ", latin: kh}
  - {ipa: "bʱ", latin: bh}
  - {ipa: "dʱ", latin: dh}
  - {ipa: "gʱ", latin: gh}
  - {ipa: "ɔ", latin: o}
  - {ipa: "ã", latin: an}
  - {ipa: "ẽ", latin: en}
  - {ipa: "õ", latin: "on"}
core_vocabulary_average_syllables: 1.67  # hand-counted across this project's own CORE_MEANINGS glosses (jol "water"=1, agun "fire"=2, ma "mother"=1, khawa "eat"=2, manush "person"=2) -- disyllabic-leaning but with a real monosyllabic minority, landing close to but a bit above this project's own already-curated Hindi figure (1.69); illustrative, more counting uncertainty than the perfected profiles, same caveat as every newly-added language
restricted_onset_consonants: ["ɽ"]  # real Bengali ড়/ঢ় flap never opens a word
restricted_initial_consonants: ["nː", "tː", "ʃː", "gː", "dʒː", "kː", "lː"]  # geminates never open a word (medial only), but may open a later syllable
onset_frequency_tiers:
  very_common: [t, k, b, m, n, s, r, l]
  common: [p, d, g, "tʃ", "dʒ", h, j]
  uncommon: ["ʃ", "ŋ", "tʃʰ", "dʒʱ", "ʈ", "ʈʰ", "ɖ"]
  rare: ["pʰ", "tʰ", "kʰ", "bʱ", "dʱ", "gʱ", "nː", "tː", "ʃː", "gː", "dʒː", "kː", "lː"]
nucleus_frequency_tiers:
  very_common: [a, i, o]
  common: [e, u, "ɔ"]
  uncommon: ["ɛ", "ã"]
  rare: ["ẽ", "õ"]
coda_frequency_tiers:
  very_common: [n, r, l, t, k]
  common: [m, "ŋ", s, b, d, g]
  uncommon: [p, "tʃ", "dʒ", j, "ɽ", "tʃʰ", "dʒʱ", "ʈ", "ʈʰ", "ɖ", "pʰ", "tʰ", "kʰ", "bʱ", "dʱ", "gʱ"]
  rare: ["ʃ", h, "nː", "tː", "ʃː", "gː", "dʒː", "kː", "lː"]

attested_coda_clusters:
  # real clusters found by `conlang audit-lexicons`
  - [n, "tʃ"]