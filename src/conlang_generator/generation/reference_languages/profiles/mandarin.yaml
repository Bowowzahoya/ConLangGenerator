name: Mandarin
aliases: [chinese, mandarin chinese]
consonants: [p, t, k, "tʃ", "ʈ", "ʂ", "ʐ", m, n, "ŋ", f, s, "ʃ", x, l, j, w]
vowels: [i, a, u, e, o, y]
coda_profile: sonorant
max_onset: 1
tonal: true
orthography_category: wade-giles-style
restricted_onset_consonants: ["ŋ"]  # real Mandarin /ŋ/ (ng) is coda-only -- no native syllable ever begins with it
restricted_coda_consonants: [m, l, j, w]
# coda_profile: sonorant above already limits codas to the sonority-based
# sonorant class (m/n/ŋ/l/j/w here), but real Standard Mandarin only ever
# closes a syllable in /n/ or /ŋ/ (pinyin -n/-ng) -- no native syllable
# ends in m, l, w, or a glide. No attested_onset_clusters/coda_clusters --
# real Mandarin syllables are strictly (C)(G)V(V)(n/ng), with no
# tautosyllabic consonant clusters at either edge.
#
# Real Mandarin also has a genuine, well-documented "neutral tone"
# (轻声) phenomenon that plays a stress-like prosodic role -- but it's
# lexically/grammatically conditioned (near-obligatory on a closed class
# of function morphemes like 的/了/吗; otherwise a lexical property of
# specific disyllabic words like 妈妈/意思, not predictable from shape),
# not a flat positional rule a phonologist would encode safely. Left
# unmodeled, same "real but not rule-capturable" reasoning that already
# keeps Hindi's own schwa deletion out of scope -- stress_pattern stays
# uncurated (Mandarin's own tone system, already `tonal: true`, is this
# language's real prosodic axis).
# Real Mandarin has (at least) two well-known romanizations that disagree
# specifically on tone marking: Pinyin marks it as a diacritic over the
# vowel (ā á ǎ à -- this project's own RomanizationScheme.apply() default,
# needing no rule below at all), Wade-Giles as a digit after the syllable
# (Wade-Giles-style "postposed_digit" -- see generation/romanization_gen.py).
# Tagging this profile with "wade-giles-style" means a Mandarin-biased
# generated language usually, not always, lands on the postposed-digit
# convention instead of Pinyin's own inline one; the /y/ rule below is
# Pinyin's own convention regardless of which tone-marking style wins, and
# still applies independently.
orthography:
  # Real Mandarin pinyin conventions, restricted to symbols this profile
  # actually models -- illustrative, not a full account.
  #
  # Pinyin drops the umlaut on /y/ (spelled "ü") specifically after a
  # palatal-associated initial, where it's the only vowel that could
  # follow and the umlaut is redundant -- real pinyin keys this off the
  # j/q/x initials specifically; simplified here to the palatal glide "j",
  # the closest this project's symbol pool models.
  - {ipa: y, latin: "ü"}
  - {ipa: y, latin: u, preceding: [j]}
  # Illustrative pinyin mapping for this profile's own retroflex/affricate
  # series -- approximate, not a precise account of Mandarin's actual
  # phoneme inventory (this project's simplified consonant model doesn't
  # distinguish retroflex affricates from the plain retroflex stop the
  # way real Mandarin phonology does).
  - {ipa: "ʈ", latin: zh}
  - {ipa: "ʂ", latin: sh}
  - {ipa: "ʐ", latin: r}
  - {ipa: "tʃ", latin: ch}
  - {ipa: "ʃ", latin: x}
  - {ipa: "ŋ", latin: ng}
  - {ipa: x, latin: h}
core_vocabulary_average_syllables: 1.24  # hand-counted across this project's own CORE_MEANINGS glosses, at the *word* level (太阳/tàiyáng "sun", 妈妈/māma "mother"), not the morpheme level -- real Mandarin is famously monosyllabic at the *morpheme* root (each syllable independently meaningful and tonally specified), but many everyday words are disyllabic compounds, so a word-level count lands much closer to Danish/Swedish's own figures than the "monosyllabic language" reputation would suggest; illustrative, more counting uncertainty than the perfected profiles, same caveat as every newly-added language
onset_frequency_tiers:
  very_common: [t, k, m, n, l, s]
  common: [p, f, x, j, w, "ʃ"]
  uncommon: ["tʃ", "ʈ", "ʂ"]
  rare: ["ʐ"]  # /ŋ/, this position's only other candidate, is excluded from onset entirely (see restricted_onset_consonants above) -- nothing legal left for that slot
nucleus_frequency_tiers:
  very_common: [a, i, u]
  common: [e, o]
  uncommon: [y]
  rare: []  # this profile's own vowel set has nothing left for this tier -- same legitimately-empty-tier precedent Persian's own nucleus table already has
# No coda_frequency_tiers -- coda_profile: sonorant means the true legal
# coda set is narrower than consonants-minus-restricted (sonority
# filtering isn't expressible via restricted_coda_consonants alone), the
# same real reason Italian's/Tamil's own perfected profiles leave this
# field uncurated too.
